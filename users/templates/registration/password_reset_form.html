{% extends "complaints/base.html" %}

{% block title %}Şifre Sıfırla | KentRadar{% endblock %}

{% block content %}
<section class="form-shell auth-shell">
  <div class="form-header">
    <p class="eyebrow">Şifre sıfırlama</p>
    <h1>E-posta adresinizi yazın</h1>
  </div>
  <form method="post" class="complaint-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sıfırlama Bağlantısı Gönder</button>
  </form>
</section>
{% endblock %}
