{% extends "complaints/base.html" %}

{% block title %}Giriş | KentRadar{% endblock %}

{% block content %}
<section class="form-shell auth-shell">
  <div class="form-header">
    <p class="eyebrow">Giriş</p>
    <h1>Hesabınıza giriş yapın</h1>
  </div>

  <form method="post" class="complaint-form">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label class="field">
      <span>Kullanıcı adı</span>
      {{ form.username }}
    </label>
    <label class="field">
      <span>Şifre</span>
      {{ form.password }}
    </label>
    <button type="submit">Giriş Yap</button>
    <a class="text-link" href="{% url 'password_reset' %}">Şifremi unuttum</a>
  </form>
</section>
{% endblock %}
