{% extends "complaints/base.html" %}

{% block title %}Şikayet Sil | KentRadar{% endblock %}

{% block content %}
<section class="form-shell">
  <div class="form-header">
    <p class="eyebrow">Silme onayı</p>
    <h1>{{ complaint.title }}</h1>
  </div>
  <form method="post" class="complaint-form">
    {% csrf_token %}
    <p>Bu şikayet kaydı kalıcı olarak silinecek.</p>
    <div class="form-actions">
      <a class="outline-button" href="{% url 'complaints:detail' complaint.pk %}">Vazgeç</a>
      <button type="submit" class="danger-submit">Sil</button>
    </div>
  </form>
</section>
{% endblock %}
